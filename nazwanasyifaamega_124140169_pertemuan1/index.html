<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini POS Kasir Kantin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Kasir Kantin</h1>
    <p>Catat belanja, hitung diskon, dan kembalian dalam satu layar.</p>
  </header>

  <main class="layout">
    <div class="kolom-kiri">
      <section class="panel" aria-labelledby="judul-form">
        <h2 id="judul-form">Tambah barang</h2>
        <form id="form-barang" novalidate>
          <div class="field">
            <label for="nama">Nama barang</label>
            <input type="text" id="nama" placeholder="Contoh: Buku Tulis" autocomplete="off">
            <small class="error" id="error-nama" role="alert"></small>
          </div>
          <div class="baris">
            <div class="field">
              <label for="harga">Harga satuan (Rp)</label>
              <input type="number" id="harga" placeholder="Minimal 500" inputmode="numeric">
              <small class="error" id="error-harga" role="alert"></small>
            </div>
            <div class="field">
              <label for="qty">Jumlah</label>
              <input type="number" id="qty" placeholder="Minimal 1" inputmode="numeric">
              <small class="error" id="error-qty" role="alert"></small>
            </div>
          </div>
          <button type="submit" class="btn btn-utama">Tambah ke keranjang</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="judul-keranjang">
        <h2 id="judul-keranjang">Keranjang belanja</h2>
        <div class="tabel-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th><th>Nama Barang</th><th class="angka">Harga Satuan</th>
                <th class="angka">Qty</th><th class="angka">Subtotal</th><th>Aksi</th>
              </tr>
            </thead>
            <tbody id="daftar-keranjang"></tbody>
          </table>
        </div>
      </section>
    </div>

    <aside class="struk" aria-labelledby="judul-struk">
      <h2 id="judul-struk">Struk belanja</h2>
      <dl>
        <div><dt>Total belanja</dt><dd id="total-belanja">Rp 0</dd></div>
        <div><dt id="label-diskon">Diskon</dt><dd id="nominal-diskon">Rp 0</dd></div>
        <div class="total"><dt>Total akhir</dt><dd id="total-akhir">Rp 0</dd></div>
      </dl>
      <p class="info-diskon" id="info-diskon"></p>

      <label for="uang-bayar">Uang bayar (Rp)</label>
      <input type="number" id="uang-bayar" placeholder="Masukkan uang diterima" inputmode="numeric">
      <p class="hasil-bayar" id="hasil-bayar"></p>

      <button type="button" class="btn btn-sekunder" id="btn-reset">Transaksi baru</button>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
