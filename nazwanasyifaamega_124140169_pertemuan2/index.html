<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tugas Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Dashboard Tugas Mahasiswa</h1>
    <p id="tanggal"></p>
  </header>

  <main class="layout">
    <aside class="kolom-kiri">
      <section class="panel">
        <h2>Cuaca Kampus ITERA</h2>
        <p id="cuaca">Memuat cuaca...</p>
      </section>

      <section class="panel">
        <h2>Kutipan Hari Ini</h2>
        <p id="kutipan">Memuat kutipan...</p>
      </section>

      <section class="panel">
        <h2 id="judul-form">Tambah tugas</h2>
        <form id="form-tugas" novalidate>
          <label for="judul">Judul tugas</label>
          <input type="text" id="judul" placeholder="Contoh: Laporan Modul 3">

          <label for="matkul">Mata kuliah</label>
          <input type="text" id="matkul" placeholder="Contoh: Jaringan Komputer">

          <label for="deadline">Deadline</label>
          <input type="date" id="deadline">

          <p class="error" id="pesan-error"></p>
          <button type="submit" class="btn btn-utama" id="btn-simpan">Tambah tugas</button>
          <button type="button" class="btn btn-sekunder" id="btn-batal" hidden>Batal edit</button>
        </form>
      </section>
    </aside>

    <section class="kolom-kanan">
      <div class="statistik">
        <div class="kotak"><span id="stat-total">0</span> Total</div>
        <div class="kotak"><span id="stat-belum">0</span> Belum selesai</div>
        <div class="kotak"><span id="stat-selesai">0</span> Selesai</div>
      </div>

      <div class="panel">
        <label for="filter">Tampilkan:</label>
        <select id="filter">
          <option value="semua">Semua tugas</option>
          <option value="belum">Belum selesai</option>
          <option value="selesai">Sudah selesai</option>
        </select>

        <ul id="daftar-tugas"></ul>
        <p id="kosong" class="kosong">Belum ada tugas.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
